<!doctype html>
<html>
<head>
    <title>Dash.js via Open5GS</title>
    <script src="./component/controlbar/ControlBar.js"></script>
    <link rel="stylesheet" href="./component/controlbar/controlbar.css">
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <h1>Open5GS Network Video Test</h1>

    <!-- Panel 1: Video Player -->
    <div class="dash-video-player">
        <div class="videoContainer" id="videoContainer">
            <video id="videoPlayer" preload="auto"></video>
            <div id="videoController" class="video-controller unselectable">
                <!-- Pause Button -->
                <div id="playPauseBtn" class="btn-play-pause" title="Play/Pause">
                    <span id="iconPlayPause" class="icon-play"></span>
                </div>
                <!-- Video Time Stamp -->
                <span id="videoTime" class="time-display">00:00:00</span>
                <!-- Full Screen Button -->
                <div id="fullscreenBtn" class="btn-fullscreen control-icon-layout" title="Fullscreen">
                    <span class="icon-fullscreen-enter"></span>
                </div>
                <!-- Adjust for Bitrate -->
                <div id="bitrateListBtn" class="control-icon-layout" title="Bitrate List">
                    <span class="icon-bitrate"></span>
                </div>
                <!-- Volume -->
                <input type="range" id="volumebar" class="volumebar" value="1" min="0" max="1" step=".01">
                <!-- Mute / Unmute -->
                <div id="muteBtn" class="btn-mute control-icon-layout" title="Mute">
                    <span id="iconMute" class="icon-mute-off"></span>
                </div>
                <div id="trackSwitchBtn" class="control-icon-layout" title="A/V Tracks">
                    <span class="icon-tracks"></span>
                </div>
                <div id="captionBtn" class="btn-caption control-icon-layout" title="Closed Caption">
                    <span class="icon-caption"></span>
                </div>
                <span id="videoDuration" class="duration-display">00:00:00</span>
                <!-- SeekBar -->
                <div class="seekContainer">
                    <div id="seekbar" class="seekbar seekbar-complete">
                        <div id="seekbar-buffer" class="seekbar seekbar-buffer"></div>
                        <div id="seekbar-play" class="seekbar seekbar-play"></div> 
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Panel 2: for Network Metrics -->
    <div class="metrics-panel">
        <h3>Network Metrics</h3>
        <div class="metric-item">
            <span class="metric-label">Browser:</span>
            <span id="browserType">--</span>
        </div>
        <div class="metric-item">
            <span class="metric-label">Reported BitRate:</span>
            <span id="reportedBitrate">--</span>
        </div>
        <div class="metric-item" id="chrome-only">
            <span class="metric-label"> Calculated BitRate:</span>
            <span id="calculatedBitrate">--</span>
        </div>
        <div class="metric-item">
            <span class="metric-label">Buffer Level:</span>
            <span id="bufferLevel">--</span>
        </div>
        <div class="metric-item">
            <span class="metric-label">FrameRate:</span>
            <span id="framerate">--</span>
        </div>
        <div class="metric-item">
            <span class="metric-label">Resolution:</span>
            <span id="resolution">--</span>
        </div>
    </div>

    <!-- Module 3: Two Buttons -->
    <!-- TBD -->
    <div>
        <button id="switchBtn">CoreNet Switching Simulation</button>
        <button id="statsBtn">Statistics</button>
    </div>
    <div id="stats"></div>

    <!-- Import Modules -->
    <script src="./js/metrics.js"></script>
    <script src="./js/eventHandlers.js"></script>
    <script src="./js/main.js"></script>

    <h5>Copyright &copy 2025. Boxuan Hu</h5>
</body>
</html>
