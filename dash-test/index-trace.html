<!doctype html>
<html>
<head>
    <title>Dash.js via Open5GS</title>
    <script src="./component/controlbar/ControlBar.js"></script>
    <link rel="stylesheet" href="./component/controlbar/controlbar.css">
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <style>
        body { margin: 20px; font-family: Arial, sans-serif; }
        #stats { margin-top: 20px; font-family: monospace; }
        
        /* video container size */
        .dash-video-player {
            max-width: 600px;
            margin: 0;
        }
        
        #videoContainer {
            position: relative;
            width: 100%;
        }
        
        #videoPlayer {
            width: 100%;
            height: auto;
            max-height: 350px;
        }
        
        /* controlbar  size*/
        .video-controller {
            width: 100%;
            max-width: 600px;
        }
        
        .seekContainer {
            width: 100%;
            max-width: 100%;
        }

        /* Metrics panel styling */
        .metrics-panel {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f8f9fa;
        }
        .metrics-panel h3 {
            margin-top: 0;
            margin-bottom: 15px;
        }
        .metrics-panel .metric-item {
            margin-bottom: 8px;
        }
        .metrics-panel .metric-label {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Open5GS Network Video Test</h1>

    <!-- Panel 1: Video Player -->
    <div class="dash-video-player">
        <div class="videoContainer" id="videoContainer">
            <video id="videoPlayer" preload="auto"></video>
            <div id="videoController" class="video-controller unselectable">
                <!-- Pause Button -->
                <div id="playPauseBtn" class="btn-play-pause" title="Play/Pause">
                    <span id="iconPlayPause" class="icon-play"></span>
                </div>
                <!-- Video Time Stamp -->
                <span id="videoTime" class="time-display">00:00:00</span>
                <!-- Full Screen Button -->
                <div id="fullscreenBtn" class="btn-fullscreen control-icon-layout" title="Fullscreen">
                    <span class="icon-fullscreen-enter"></span>
                </div>
                <!-- Adjust for Bitrate -->
                <div id="bitrateListBtn" class="control-icon-layout" title="Bitrate List">
                    <span class="icon-bitrate"></span>
                </div>
                <!-- Volume -->
                <input type="range" id="volumebar" class="volumebar" value="1" min="0" max="1" step=".01">
                <!-- Mute / Unmute -->
                <div id="muteBtn" class="btn-mute control-icon-layout" title="Mute">
                    <span id="iconMute" class="icon-mute-off"></span>
                </div>
                <div id="trackSwitchBtn" class="control-icon-layout" title="A/V Tracks">
                    <span class="icon-tracks"></span>
                </div>
                <div id="captionBtn" class="btn-caption control-icon-layout" title="Closed Caption">
                    <span class="icon-caption"></span>
                </div>
                <span id="videoDuration" class="duration-display">00:00:00</span>
                <!-- SeekBar -->
                <div class="seekContainer">
                    <div id="seekbar" class="seekbar seekbar-complete">
                        <!-- seekbar-complete: total length of the video -->
                        <!-- seekbar-play: current play position -->
                        <!-- seekbar-buffer: buffered length of the video -->
                        <div id="seekbar-buffer" class="seekbar seekbar-buffer"></div>
                        <div id="seekbar-play" class="seekbar seekbar-play"></div> 
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Panel 2: for Network Metrics -->
    <div class="metrics-panel">
        <h3>Network Metrics</h3>
        <div class="metric-item">
            <span class="metric-label">Browser:</span>
            <span id="browserType">--</span>
        </div>
        <div class="metric-item">
            <span class="metric-label">Reported BitRate:</span>
            <span id="reportedBitrate">--</span>
        </div>
        <div class="metric-item" id="chrome-only">
            <span class="metric-label"> Calculated BitRate:</span>
            <span id="calculatedBitrate">--</span>
        </div>
        <div class="metric-item">
            <span class="metric-label">Buffer Level:</span>
            <span id="bufferLevel">--</span>
        </div>
        <div class="metric-item">
            <span class="metric-label">FrameRate:</span>
            <span id="framerate">--</span>
        </div>
        <div class="metric-item">
            <span class="metric-label">Resolution:</span>
            <span id="resolution">--</span>
        </div>
    </div>

    <div>
        <button id="switchBtn">CoreNet Switching Simulation</button>
        <button id="statsBtn">Statistics</button>
    </div>
    <div id="stats"></div>

    <script>
        (function() {
            // url: where to get the video (CDN Server)
            var url = "https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd";
            var videoElement = document.querySelector('#videoPlayer');
            var player = dashjs.MediaPlayer().create();

            // buffer management
            player.updateSettings({
                streaming: {
                    buffer: {
                        // ahead buffer settings
                        bufferTimeAtTopQuality: 12,
                        bufferTimeAtTopQualityLongForm: 12,
                        bufferTimeDefault: 12,
                        longFormContentDurationThreshold: 600,
                        // backforward buffer settings
                        bufferPruningInterval: 1,
                        bufferToKeep: 60,
                    }
                }
            });

            player.initialize(videoElement, url, true);
            player.on(dashjs.MediaPlayer.events["PLAYBACK_ENDED"], function () {
                clearInterval(eventPoller);
                clearInterval(bitrateCalculator);
            });

            function detectBrowser() {
                const userAgent = navigator.userAgent;
                let browserName = "Unknown";
                let metricsInfo = "";
                
                if (userAgent.indexOf("Chrome") > -1) {
                    browserName = "Chrome";
                    metricsInfo = "All Five Metrics will be shown, details can be checked in console";
                } else if (userAgent.indexOf("Safari") > -1) {
                    browserName = "Safari";
                    metricsInfo = "All Five Metrics will be shown, details can be checked in console";
                } else if (userAgent.indexOf("Firefox") > -1) {
                    browserName = "Firefox";
                    metricsInfo = "Only Four Metrics will be shown, details can be checked in console";
                } else if (userAgent.indexOf("MSIE") > -1 || userAgent.indexOf("Trident") > -1) {
                    browserName = "Internet Explorer";
                    metricsInfo = "Out of Date, please use Chrome / Safari / Edge ...";
                } else if (userAgent.indexOf("Edge") > -1) {
                    browserName = "Edge";
                    metricsInfo = "All Five Metrics will be shown, details can be checked in console";
                } else {
                    browserName = "Unknown";
                    metricsInfo = "Please use Chrome / Safari / Edge ...";
                }

                document.getElementById('browserType').innerText = browserName + (metricsInfo ? " - " + metricsInfo : "");
            }
            detectBrowser();

            var controlbar = new ControlBar(player);
            controlbar.initialize();

            // Metrics Polling
            /*
            The four following metrics are polled from DASH.js:
            1. Reported Bitrate: The bitrate reported by the DASH.js player.
            2. Buffer Level: The current buffer level in seconds.
            3. Frame Rate: The frame rate of current video.
            4. Resolution: The resolution of current video.
            */
            var eventPoller = setInterval(function () {
                var streamInfo = player.getActiveStream().getStreamInfo();
                var dashMetrics = player.getDashMetrics();
                var dashAdapter = player.getDashAdapter();

                if (dashMetrics && streamInfo) {
                    // Directly use the Dash.js API to get the metrics
                    const periodIdx = streamInfo.index;
                    var repSwitch = dashMetrics.getCurrentRepresentationSwitch('video');
                    var bufferLevel = dashMetrics.getCurrentBufferLevel('video');
                    var bitrate = repSwitch ? Math.round(dashAdapter.getBandwidthForRepresentation(repSwitch.to, periodIdx) / 1000) : NaN;
                    var currentRep = player.getCurrentRepresentationForType('video');
                    var frameRate = currentRep.frameRate;
                    var resolution = currentRep.width + 'x' + currentRep.height;
                    document.getElementById('bufferLevel').innerText = bufferLevel + " s";
                    document.getElementById('framerate').innerText = frameRate + " fps";
                    document.getElementById('reportedBitrate').innerText = bitrate + " Kbps";
                    document.getElementById('resolution').innerText = resolution;
                }
            }, 1000);

            // Calculated Bitrate
            /*
            1. webkitVideoDecodedByteCount is a non-standard API, only supported in Chrome / Safari / Edge
            2. It is not supported in Firefox / Zen
            */
            var bitrateCalculator;
            videoElement.addEventListener('loadeddata', function() {
                if (videoElement.webkitVideoDecodedByteCount !== undefined) {
                    // Chrome / Safari / Edge is supported
                    // Firefox / Zen does not support this API
                    var lastDecodedByteCount = 0;
                    const bitrateInterval = 5;
                    bitrateCalculator = setInterval(function () {
                        try {
                            var currentDecodedByteCount = videoElement.webkitVideoDecodedByteCount;
                            if (typeof currentDecodedByteCount === 'number') {
                                var calculatedBitrate = (((currentDecodedByteCount - lastDecodedByteCount) / 1000) * 8) / bitrateInterval;
                                document.getElementById('calculatedBitrate').innerText = Math.round(calculatedBitrate) + " Kbps";
                                lastDecodedByteCount = currentDecodedByteCount;
                                console.log('[Valid Decoded]');
                                console.log('Bytes Decoded:', currentDecodedByteCount, 'BitRate:', Math.round(calculatedBitrate));
                            } else {
                                console.log('[Invalid Decoding]');
                                console.log('Invalid Decoded:', currentDecodedByteCount);
                            }
                        } catch (e) {
                            console.error('Error when Decoding:', e);
                        }
                    }, bitrateInterval * 1000);
                    console.log('Decoded Bytes:', lastDecodedByteCount);
                } else {
                    document.getElementById('chrome-only').style.display = "none";
                    console.log('Current Web Browser did not support webkitVideoDecodedByteCount API');
                    console.log('Current Web Browser:', navigator.userAgent);
                    console.log('Please use Chrome / Safari / Edge ... ');
                }
            });

            /*
            TL;DR Metrics on different browsers

            (1) For Test on Chrome:

            1. Reported BitRate
            2. Buffer Level
            3. Calculated BitRate
            4. FrameRate
            5. Resolution

            (2) For Test on Firefox:

            1. Reported BitRate
            2. Buffer Level
            3. FrameRate
            4. Resolution
            */

            // Statistics Button
            // TODO: bxhu, statistics panel, visualization better
            document.getElementById('statsBtn').onclick = function() {
                var statsDiv = document.getElementById('stats');
                if (statsDiv.style.display === 'none' || statsDiv.innerHTML === '') {
                    var metrics = player.getMetricsFor('video');
                    statsDiv.innerHTML = JSON.stringify(metrics, null, 2);
                    statsDiv.style.display = 'block';
                } else {
                    statsDiv.style.display = 'none';
                }
            };

            // CoreNet Switching Bottom
            // TODO: bxhu, interation with CoreNet (../scenario2/main.py)
            document.getElementById('switchBtn').onclick = function() {
                player.setAutoSwitchQualityFor('video', false);
                setTimeout(function() {
                    player.setAutoSwitchQualityFor('video', true);
                    alert('CoreNet will be switching in 20 seconds :)');
                }, 2000);
            };

            window.player = player;
        })();
    </script>
</body>
</html>
